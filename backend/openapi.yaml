  /api/v1/checkins/:
    get:
      operationId: checkins_list
      description: Check-ins and anomalies (``result=refused``) for HR, managers (their
        scope) and auditors.
      parameters:
      - in: query
        name: agent
        schema:
          type: string
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      - in: query
        name: date
        schema:
          type: string
          format: date
      - in: query
        name: offline
        schema:
          type: boolean
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: result
        schema:
          type: string
          enum:
          - accepted
          - ignored
          - refused
      - in: query
        name: site
        schema:
          type: string
      tags:
      - checkins
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCheckInList'
          description: ''
