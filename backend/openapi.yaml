components:
  schemas:
    ActivateRequestRequest:
      type: object
      properties:
        device_id:
          type: string
          minLength: 1
          maxLength: 128
        model:
          type: string
          default: ''
          maxLength: 120
        os:
          type: string
          default: ''
          maxLength: 60
      required:
      - device_id
    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        employee_number:
          type: string
          title: Matricule
          maxLength: 32
        last_name:
          type: string
          title: Nom
          maxLength: 100
        first_names:
          type: string
          title: Prénoms
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        job_title:
          type: string
          title: Fonction
          maxLength: 120
        phone:
          type: string
          title: Téléphone
          maxLength: 32
        email:
          title: E-mail
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        site:
          type: string
          format: uuid
          nullable: true
        site_name:
          type: string
          readOnly: true
        org_unit:
          type: string
          format: uuid
          nullable: true
          title: Unité
        org_unit_name:
          type: string
          readOnly: true
        schedule:
          type: string
          format: uuid
          nullable: true
          title: Horaire
        status:
          $ref: '#/components/schemas/AgentStatusEnum'
        has_device:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Créé le
      required:
      - created_at
      - employee_number
      - first_names
      - full_name
      - has_device
      - id
      - last_name
      - org_unit_name
      - site_name
    AgentRequest:
      type: object
      properties:
        employee_number:
          type: string
          minLength: 1
          title: Matricule
          maxLength: 32
        last_name:
          type: string
          minLength: 1
          title: Nom
          maxLength: 100
        first_names:
          type: string
          minLength: 1
          title: Prénoms
          maxLength: 150
        job_title:
          type: string
          title: Fonction
          maxLength: 120
        phone:
          type: string
          title: Téléphone
          maxLength: 32
        email:
          title: E-mail
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        site:
          type: string
          format: uuid
          nullable: true
        org_unit:
          type: string
          format: uuid
          nullable: true
          title: Unité
        schedule:
          type: string
          format: uuid
          nullable: true
          title: Horaire
        status:
          $ref: '#/components/schemas/AgentStatusEnum'
      required:
      - employee_number
      - first_names
      - last_name
    AgentStatusEnum:
      enum:
      - active
      - inactive
      type: string
      description: |-
        * `active` - Actif
        * `inactive` - Inactif
    AuthResponse:
      type: object
      description: Either tokens (step=authenticated) or an MFA challenge.
      properties:
        step:
          $ref: '#/components/schemas/StepEnum'
        access:
          type: string
        user:
          $ref: '#/components/schemas/Me'
        mfa_token:
          type: string
        otpauth_url:
          type: string
        secret:
          type: string
      required:
      - step
    BadgeBatchRequestRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BadgeScanRequestRequest'
      required:
      - items
    BadgeScanRequestRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
        client_uuid:
          type: string
          format: uuid
          nullable: true
        scanned_at:
          type: string
          format: date-time
          nullable: true
        offline:
          type: boolean
          default: false
      required:
      - token
    BatchItemResult:
      type: object
      properties:
        client_uuid:
          type: string
          format: uuid
          nullable: true
        result:
          type: string
        refusal_code:
          type: string
      required:
      - client_uuid
      - refusal_code
      - result
    BatchResult:
      type: object
      properties:
        received:
          type: integer
        accepted:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchItemResult'
      required:
      - accepted
      - items
      - received
    CheckIn:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        agent:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        agent_name:
          type: string
          readOnly: true
        employee_number:
          type: string
          readOnly: true
        site:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        site_name:
          type: string
          readOnly: true
        kiosk:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        kiosk_name:
          type: string
          readOnly: true
        direction:
          allOf:
          - $ref: '#/components/schemas/DirectionEnum'
          readOnly: true
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          readOnly: true
        trust:
          allOf:
          - $ref: '#/components/schemas/TrustEnum'
          readOnly: true
        server_ts:
          type: string
          format: date-time
          readOnly: true
          title: Heure serveur
        effective_ts:
          type: string
          format: date-time
          readOnly: true
          title: Heure retenue
        offline:
          type: boolean
          readOnly: true
          title: Hors-ligne
        distance_m:
          type: integer
          readOnly: true
          nullable: true
          title: Distance au site (m)
        accuracy_m:
          type: integer
          readOnly: true
          nullable: true
        result:
          allOf:
          - $ref: '#/components/schemas/ResultEnum'
          readOnly: true
        refusal_code:
          allOf:
          - $ref: '#/components/schemas/RefusalCodeEnum'
          readOnly: true
        refusal_label:
          type: string
          readOnly: true
        refusal_details:
          readOnly: true
        is_correction:
          type: boolean
          readOnly: true
        corrects:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        reason:
          type: string
          readOnly: true
          title: Motif
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Enregistré le
      required:
      - accuracy_m
      - agent
      - agent_name
      - corrects
      - created_at
      - direction
      - distance_m
      - effective_ts
      - employee_number
      - id
      - is_correction
      - kiosk
      - kiosk_name
      - mode
      - offline
      - reason
      - refusal_code
      - refusal_details
      - refusal_label
      - result
      - server_ts
      - site
      - site_name
      - trust
    CheckInOutcome:
      type: object
      properties:
        id:
          type: string
          format: uuid
        result:
          type: string
        direction:
          type: string
        refusal_code:
          type: string
        refusal_details:
          type: array
          items:
            type: string
        message:
