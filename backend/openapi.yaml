          title: Sous-domaine
          description: ministere-x → ministere-x.pointqr.ci
          maxLength: 63
          pattern: ^[-a-zA-Z0-9_]+$
        code:
          type: string
          title: Code entreprise
          description: Saisi dans l'application mobile et sur la borne.
          pattern: ^[A-Z0-9]{4,12}$
          maxLength: 12
        sector:
          type: string
          title: Secteur
          maxLength: 120
        country:
          type: string
          title: Pays
          maxLength: 2
        timezone:
          type: string
          title: Fuseau horaire
          maxLength: 64
        contact_name:
          type: string
          title: Contact
          maxLength: 120
        contact_email:
          title: E-mail du contact
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        contact_phone:
          type: string
          title: Téléphone du contact
          maxLength: 32
        status:
