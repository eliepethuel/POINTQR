components:
  schemas:
    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        employee_number:
          type: string
          title: Matricule
          maxLength: 32
        last_name:
          type: string
          title: Nom
          maxLength: 100
        first_names:
          type: string
          title: Prénoms
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        job_title:
          type: string
          title: Fonction
          maxLength: 120
        phone:
          type: string
          title: Téléphone
          maxLength: 32
        email:
          title: E-mail
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        site:
          type: string
          format: uuid
          nullable: true
        site_name:
          type: string
          readOnly: true
        org_unit:
          type: string
          format: uuid
          nullable: true
          title: Unité
        org_unit_name:
          type: string
          readOnly: true
        schedule:
          type: string
          format: uuid
          nullable: true
          title: Horaire
        status:
          $ref: '#/components/schemas/AgentStatusEnum'
        has_device:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Créé le
      required:
      - created_at
      - employee_number
      - first_names
      - full_name
      - has_device
      - id
      - last_name
      - org_unit_name
      - site_name
    AgentRequest:
      type: object
      properties:
        employee_number:
          type: string
          minLength: 1
          title: Matricule
          maxLength: 32
        last_name:
          type: string
          minLength: 1
          title: Nom
          maxLength: 100
        first_names:
          type: string
          minLength: 1
          title: Prénoms
          maxLength: 150
        job_title:
          type: string
          title: Fonction
          maxLength: 120
        phone:
          type: string
          title: Téléphone
          maxLength: 32
        email:
          title: E-mail
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        site:
          type: string
          format: uuid
          nullable: true
        org_unit:
          type: string
          format: uuid
          nullable: true
          title: Unité
        schedule:
          type: string
          format: uuid
          nullable: true
          title: Horaire
        status:
          $ref: '#/components/schemas/AgentStatusEnum'
      required:
      - employee_number
      - first_names
      - last_name
    AgentStatusEnum:
      enum:
      - active
      - inactive
      type: string
      description: |-
        * `active` - Actif
        * `inactive` - Inactif
    AuthResponse:
      type: object
      description: Either tokens (step=authenticated) or an MFA challenge.
      properties:
        step:
          $ref: '#/components/schemas/StepEnum'
        access:
          type: string
        user:
          $ref: '#/components/schemas/Me'
        mfa_token:
          type: string
        otpauth_url:
          type: string
        secret:
          type: string
      required:
      - step
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        legal_name:
          type: string
          title: Raison sociale
