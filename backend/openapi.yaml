          readOnly: true
        primary_color:
          type: string
          maxLength: 7
        highlight_color:
          type: string
          maxLength: 7
        created_at:
          type: string
          format: date-time
          readOnly: true
        current_subscription:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        agent_count:
          type: integer
          readOnly: true
