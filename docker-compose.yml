name: pointqr

x-backend: &backend
  build:
    context: ./backend
    target: dev
  env_file: .env
  volumes:
    - ./backend:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible object storage (justificatifs, exports). See ADR-0009.
  storage:
    image: chrislusf/seaweedfs:4.54
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes: [s3data:/data]
    ports: ["8333:8333"]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]

  migrate:
    <<: *backend
    command: ["sh", "-c", "DATABASE_URL=$$MIGRATION_DATABASE_URL python manage.py migrate --noinput"]
    restart: "no"

  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/"]
      interval: 10s
      retries: 10

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  s3data:
