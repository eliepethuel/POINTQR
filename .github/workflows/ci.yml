name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key
      # Tests run as the non-superuser owner role so row level security is really enforced.
      DATABASE_URL: postgres://pointqr_owner:owner-ci@localhost:5432/pointqr
      REDIS_URL: redis://localhost:6379/0
      FIELD_ENCRYPTION_KEY: 3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v5
      - name: Create database roles (same script as local db-init)
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h localhost -U postgres -d postgres -v db=pointqr
          -v owner_user=pointqr_owner -v owner_password=owner-ci
          -v app_user=pointqr_app -v app_password=app-ci -f infra/postgres/create-roles.sql
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.7"
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy .
      - name: Tests
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing:skip-covered
      - name: Django deploy checks
        run: uv run python manage.py check --deploy --settings=config.settings.prod --fail-level WARNING
        env:
          DJANGO_SECRET_KEY: ci-only-but-long-enough-secret-key-for-deploy-checks-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: pointqr.ci
      - name: OpenAPI schema is up to date
        run: |
          uv run python manage.py spectacular --file openapi.yaml --validate
          git diff --exit-code openapi.yaml
      - uses: actions/upload-artifact@v5
        with:
          name: openapi
          path: backend/openapi.yaml

  frontend:
    runs-on: ubuntu-24.04
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated API client is up to date
        run: |
          npm run api:generate
          git diff --exit-code src/app/api
      - name: Lint and format
        run: npm run lint && npm run format:check
      - name: Types
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --watch=false
      - name: Build
        run: npm run build

  docker:
    # Phase 6 (ADR-0014): build the images, start the whole stack, smoke-test it.
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Environment with random secrets
        run: sh infra/scripts/init-env.sh
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Wait for the API behind nginx
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/v1/health/ && exit 0
            sleep 5
          done
          exit 1
      - name: Smoke tests
        run: python3 infra/scripts/smoke-docker.py http://localhost:8080
      - name: Runtime database role cannot bypass row level security
        run: |
          test "$(docker compose exec -T postgres psql -U postgres -tAc \
            "select rolsuper::text || rolbypassrls::text from pg_roles where rolname = 'pointqr_app'")" = "falsefalse"
      - name: Celery worker answers
        run: |
          for i in $(seq 1 12); do
            docker compose exec -T worker celery -A config inspect ping --timeout 5 && exit 0
            sleep 5
          done
          exit 1
      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 200
          # Also as annotations, readable without signing in to GitHub.
          for svc in worker beat backend migrate; do
            docker compose logs --no-color --tail 15 "$svc" 2>&1 | sed "s/^/::error title=$svc::/"
          done
